[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ingot-cli"
version = "1.1.0"
description = "Melt a GitHub repo or local folder into one AI-ready text file."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["cli", "llm", "ai", "codebase", "context", "github"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
]

[project.scripts]
ingot = "ingot:main"

[tool.setuptools]
py-modules = ["ingot", "ingot_web"]
